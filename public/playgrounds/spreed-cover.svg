<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bgGradientSpreed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a0a1a"/>
      <stop offset="100%" style="stop-color:#0f0f23"/>
    </linearGradient>
    <linearGradient id="speedGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f72585"/>
      <stop offset="50%" style="stop-color:#7209b7"/>
      <stop offset="100%" style="stop-color:#3a0ca3"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4cc9f0"/>
      <stop offset="100%" style="stop-color:#4361ee"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="speedBlur">
      <feGaussianBlur stdDeviation="0 3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradientSpreed)"/>
  
  <!-- Speed lines background -->
  <g opacity="0.15">
    <rect x="0" y="100" width="800" height="3" fill="url(#speedGradient)">
      <animate attributeName="x" values="-800;800" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="180" width="800" height="2" fill="url(#speedGradient)">
      <animate attributeName="x" values="-800;800" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="270" width="800" height="3" fill="url(#speedGradient)">
      <animate attributeName="x" values="-800;800" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="350" width="800" height="2" fill="url(#speedGradient)">
      <animate attributeName="x" values="-800;800" dur="1.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Central focus area -->
  <g transform="translate(400, 225)">
    <!-- Outer glow ring -->
    <ellipse cx="0" cy="0" rx="180" ry="100" fill="none" stroke="#f72585" stroke-width="1" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="220" ry="120" fill="none" stroke="#7209b7" stroke-width="0.5" opacity="0.2"/>
    
    <!-- Focus box -->
    <rect x="-150" y="-50" width="300" height="100" fill="#0a0a0a" stroke="url(#textGlow)" stroke-width="2" rx="8"/>
    
    <!-- Animated word display simulation -->
    <text x="0" y="15" text-anchor="middle" fill="url(#textGlow)" font-family="system-ui, sans-serif" font-size="48" font-weight="bold">
      SPEED
      <animate attributeName="opacity" values="1;0.3;1" dur="0.5s" repeatCount="indefinite"/>
    </text>
    
    <!-- Progress indicator -->
    <rect x="-140" y="35" width="280" height="4" fill="#1a1a2e" rx="2"/>
    <rect x="-140" y="35" width="0" height="4" fill="url(#speedGradient)" rx="2">
      <animate attributeName="width" values="0;280;0" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- WPM indicator -->
  <g transform="translate(680, 80)">
    <rect x="-50" y="-30" width="100" height="60" fill="#1a0a1a" stroke="#f72585" stroke-width="1" rx="8" opacity="0.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#f72585" font-family="monospace" font-size="24" font-weight="bold">
      300
    </text>
    <text x="0" y="15" text-anchor="middle" fill="#7209b7" font-family="system-ui, sans-serif" font-size="12">
      WPM
    </text>
  </g>
  
  <!-- Speed dial visualization -->
  <g transform="translate(120, 350)">
    <path d="M -60 0 A 60 60 0 0 1 60 0" fill="none" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round"/>
    <path d="M -60 0 A 60 60 0 0 1 30 -52" fill="none" stroke="url(#speedGradient)" stroke-width="8" stroke-linecap="round">
      <animate attributeName="d" 
        values="M -60 0 A 60 60 0 0 1 -40 -45;M -60 0 A 60 60 0 0 1 50 -37;M -60 0 A 60 60 0 0 1 -40 -45" 
        dur="4s" repeatCount="indefinite"/>
    </path>
    <text x="0" y="30" text-anchor="middle" fill="#666" font-family="system-ui, sans-serif" font-size="10">SPEED</text>
  </g>
  
  <!-- Text lines simulation (blurred for motion) -->
  <g opacity="0.4" filter="url(#speedBlur)">
    <rect x="50" y="140" width="250" height="6" fill="#4cc9f0" rx="3">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="155" width="180" height="6" fill="#4361ee" rx="3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="500" y="290" width="220" height="6" fill="#4cc9f0" rx="3">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="520" y="305" width="160" height="6" fill="#4361ee" rx="3">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="0.7s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Floating particles -->
  <g fill="#f72585">
    <circle cx="150" cy="100" r="3" opacity="0.5">
      <animate attributeName="cx" values="150;750;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="200" r="2" opacity="0.4">
      <animate attributeName="cx" values="100;700;100" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#4cc9f0">
    <circle cx="200" cy="380" r="2" opacity="0.6">
      <animate attributeName="cx" values="200;600;200" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="120" r="3" opacity="0.3">
      <animate attributeName="cx" values="650;50;650" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Corner accents -->
  <path d="M 0 0 L 80 0 L 0 80 Z" fill="#f72585" opacity="0.1"/>
  <path d="M 800 450 L 720 450 L 800 370 Z" fill="#4cc9f0" opacity="0.1"/>
</svg>